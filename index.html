<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Garde-fou d'intro :
      - la classe .js masque le hero tant que le préloader n'a pas fini (évite un flash) ;
      - si le JS n'a pas fini l'intro après 6 s (réseau lent, erreur), .intro-fallback
        réaffiche tout et cache le préloader. Sans JS, rien n'est masqué.
    -->
    <script>
      document.documentElement.classList.add('js');
      setTimeout(function () {
        if (!window.__introDone) document.documentElement.classList.add('intro-fallback');
      }, 6000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
